<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" href="Tren.ico" type="image/x-icon">
  <meta charset="UTF-8">
  <meta name="geo.region" content="AR-BUE" /> <!-- Buenos Aires, Argentina -->
  <meta name="geo.placename" content="Buenos Aires" />
  <meta name="geo.position" content="-34.6037;-58.3816" />
  <meta name="google-site-verification" content="pgIVSgq4strcU9SEKpVIDdnZhGr3G9i1tDci9Un9KUU" />
  <meta name="description" content="Obten los Horarios en Tiempo Real de los Trenes Argentinos. Planifica tus viajes. Mira cuando llega el tren y cuanto tiempo de viaje tienes. Muy facil de usar. Trenes Buenos Aires, CABA, bsas, bs as. Horario Tren.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de horarios Trenes Argentinos</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <h1>Consulta de horarios Trenes Argentinos</h1>
  </header>

  <main>
    <div id="loginStatus"><span class="spinner"></span> Autenticando...</div>

    <div id="menu" style="display: none;">
      <div id="ultimaBusqueda" class="ocultar"></div>

      <div class="tarjeta-busqueda">
        <div class="campo-busqueda">
          <label for="origin-input">Estación de Origen</label>
          <input type="text" id="origin-input" autocomplete="off" placeholder="Ej: Once, Tigre, Moreno...">
          <ul id="origin-list" class="autocomplete-list ocultar"></ul>
        </div>

        <div class="fila-swap">
          <button id="botonEspecial" type="button" title="Intercambiar origen y destino"><b>⇅</b></button>
        </div>

        <div class="campo-busqueda">
          <label for="destination-input">Estación de Destino</label>
          <input type="text" id="destination-input" autocomplete="off" placeholder="Ej: Once, Tigre, Moreno...">
          <ul id="destination-list" class="autocomplete-list ocultar"></ul>
        </div>

        <button id="buscarBtn" type="button" disabled>Buscar Horarios</button>
      </div>
    </div>
  </main>

  <div id="result" class="ocultar"></div>

  <script src="js/app.js" defer></script>
</body>
</html>
