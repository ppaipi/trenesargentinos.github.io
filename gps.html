<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" href="Tren.ico" type="image/x-icon">
  <meta charset="UTF-8">
  <meta name="geo.region" content="AR-BUE" /> <!-- Buenos Aires, Argentina -->
  <meta name="geo.placename" content="Buenos Aires" />
  <meta name="geo.position" content="-34.6037;-58.3816" />
  <meta name="google-site-verification" content="pgIVSgq4strcU9SEKpVIDdnZhGr3G9i1tDci9Un9KUU" />
  <meta name="description" content="Seguí en el mapa la ubicación de tu tren en tiempo real, con la hora estimada de llegada a tu estación.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://tapia.chiqui.ar/gps.html">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_AR">
  <meta property="og:url" content="https://tapia.chiqui.ar/gps.html">
  <meta property="og:title" content="¿Dónde está tu tren? | Mapa en vivo - Trenes Argentinos">
  <meta property="og:description" content="Seguí en el mapa la ubicación de tu tren en tiempo real, para todas las líneas del Gran Buenos Aires.">
  <title>¿Dónde está tu tren? Mapa en vivo - Trenes Argentinos</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <h1>¿Dónde está tu tren?</h1>
    <p class="subtitulo">Seguilo en el mapa en tiempo real, con la hora estimada de llegada.</p>
  </header>

  <main>
    <div id="loginStatus"><span class="spinner"></span> Autenticando...</div>

    <div id="menu" style="display: none;">
      <div class="tarjeta-busqueda">
        <div class="campo-busqueda">
          <label for="origin-input">Estación de Origen</label>
          <input type="text" id="origin-input" autocomplete="off" placeholder="Escribí o elegí por línea...">
          <div id="origin-panel" class="panel-busqueda ocultar">
            <div id="origin-chips" class="chips-fila"></div>
            <ul id="origin-list" class="autocomplete-list"></ul>
          </div>
        </div>

        <div class="fila-swap">
          <button id="botonEspecial" type="button" title="Intercambiar origen y destino"><b>⇅</b></button>
        </div>

        <div class="campo-busqueda">
          <label for="destination-input">Estación de Destino</label>
          <input type="text" id="destination-input" autocomplete="off" placeholder="Escribí o elegí por ramal...">
          <div id="destination-panel" class="panel-busqueda ocultar">
            <div id="destination-chips" class="chips-fila"></div>
            <ul id="destination-list" class="autocomplete-list"></ul>
          </div>
        </div>

        <button id="buscarBtn" type="button" disabled>Buscar Horarios</button>
      </div>
    </div>
  </main>

  <div id="result" class="ocultar"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/gps.js"></script>
</body>
</html>
